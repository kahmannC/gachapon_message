<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Message Gachapon — Sender</title>
		<link rel="preconnect" href="https://fonts.gstatic.com">
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="style.css">
	</head>
	<body data-page="sender">
		<main class="container sender">
			<section class="sender-panel">
				<p class="eyebrow">Gacha Message Maker</p>
				<h1>Build Your Gacha</h1>

				<label class="field">
					<input id="gachaTitle" type="text" placeholder="A tiny gacha for you" maxlength="80">
				</label>

				<div id="capsulesList" class="capsules-list">
					<!-- Capsules inputs inserted here by JS -->
				</div>

				<div class="controls">
					<button id="addCapsule" class="btn soft">Add capsule</button>
					<div class="spacer"></div>
					<button id="previewBtn" class="btn primary">Preview</button>
				</div>

				<aside class="preview-card">
					<h2>Preview</h2>
					<div id="previewList" class="preview-list">
						<!-- live preview of messages -->
					</div>
				</aside>
			</section>
		</main>

		<script src="script.js"></script>
	</body>
</html>
